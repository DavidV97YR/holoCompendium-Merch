name: Scrape Merch

on:
  # Triggered by cron-job.org via POST to the repository_dispatch webhook.
  # URL:    https://api.github.com/repos/YOUR_USERNAME/hololive-Merch-Archive/dispatches
  # Header: Authorization: Bearer YOUR_PAT   (PAT needs repo scope)
  # Header: Content-Type: application/json
  # Body:   {"event_type":"scrape"}
  repository_dispatch:
    types: [scrape]

  # Manual trigger from the Actions tab (also used for the backfill modes)
  # Tick at most ONE backfill. scraper.js checks --backfill-en first, so with
  # both ticked the taxonomy backfill is silently skipped.
  workflow_dispatch:
    inputs:
      backfill_en:
        description: 'Re-scan every product for missing EN images and upload to R2 as WebP'
        type: boolean
        default: false
      backfill_categories:
        description: 'Backfill merch type/category taxonomies for all products (one-time, ~45-60 min)'
        type: boolean
        default: false
      test_email:
        description: 'Email a sample new-product alert to this address (leave blank for a normal run). Scrapes nothing, changes nothing.'
        required: false
        default: ''

permissions:
  contents: write

# One run at a time. The VSPO! step can take up to BUDGET_MIN (50 min) while
# cron-job.org triggers every 30, and two runs at once would push over each
# other's merch files. A run triggered meanwhile waits for this one to finish.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # blob:none  — partial clone; fetches commits + trees but never downloads
          #              file blob contents from history. Working tree is fully
          #              visible; blobs are fetched lazily only when actually read.
          # fetch-depth: 1 — shallow clone; only the latest commit, not full history.
          # Together these give the fastest possible checkout: no old blobs, no
          # history traversal. They don't conflict — actions/checkout@v5 passes
          # both flags correctly to git.
          filter: blob:none
          fetch-depth: 1
          # The branch as it is now, not the commit the run was triggered at.
          # A run that waited behind another (concurrency, above) would
          # otherwise start from before that run's commit: without the merch
          # files it just saved, and unable to push its own on top of them.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: boolean workflow inputs are real booleans in expressions — never
      # compare against the string 'true' (GitHub coerces it to NaN → always
      # false). Plain truthiness also handles repository_dispatch, where the
      # inputs context is empty.
      - name: Run scraper
        run: node scraper.js ${{ inputs.test_email && '--test-email' || '' }} ${{ inputs.backfill_en && '--backfill-en' || '' }} ${{ inputs.backfill_categories && '--backfill-categories' || '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # New-product notification. If these are unset the scraper just logs
          # that email isn't configured and carries on.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # MAIL_TO is the owner's own copy and is optional — leave the secret
          # unset and that direct email is simply skipped. Subscribers are
          # reached by the broadcast below, not by this.
          MAIL_TO:        ${{ secrets.MAIL_TO }}
          MAIL_FROM:      ${{ secrets.MAIL_FROM }}
          # The public signup list. Unset = no broadcast, everything else works.
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          # Card layout: unset/'gallery' = cover plus up to four more of the
          # product's images, 'hero' = cover only. Set it as a repo VARIABLE
          # (Settings → Variables), not a secret.
          EMAIL_LAYOUT:   ${{ vars.EMAIL_LAYOUT }}
          # Only set by the manual test above; empty on every scheduled run.
          TEST_EMAIL_TO:  ${{ inputs.test_email }}

      # VSPO!'s shop, store.vspo.jp: its own archive (vspo-merch.json here,
      # vspo/merch.json and VSPO/ images in the same bucket). Runs after the
      # hololive scrape on every trigger, whether or not that one succeeded,
      # but not on a test-email or backfill run, which are hololive-only. The
      # first run archives the whole shop over two or three runs (it stops at
      # BUDGET_MIN and commits what it finished).
      - name: Run VSPO! scraper
        if: ${{ !cancelled() && !inputs.test_email && !inputs.backfill_en && !inputs.backfill_categories }}
        run: node vspo-scraper.js
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BUDGET_MIN:    '50'
          # New VSPO! products go to the same signup list and owner address as
          # hololive's: one list for both shops.
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          MAIL_TO:           ${{ secrets.MAIL_TO }}
          MAIL_FROM:         ${{ secrets.MAIL_FROM }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          EMAIL_LAYOUT:      ${{ vars.EMAIL_LAYOUT }}
